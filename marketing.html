let ADM=null,APP_ROLES=[];
const MROLES=[['','No marketing access'],['head','Marketing Head'],['marketing_manager','Marketing Manager'],['executive','Executive'],['designer','Designer']],MRL=Object.fromEntries(MROLES);
async function adm(action,extra){const{data,error}=await sb.functions.invoke('admin-users',{body:{action,...extra}});if(error||!data||data.error){toast((data&&data.error)||(error&&error.message)||'Admin service is not reachable');return null}return data}
async function loadAdm(){const d=await adm('list');ADM=d?d.users:[];if(d)APP_ROLES=d.app_roles||[];if(tab==='admin')draw()}
function adminView(){const head=sh('SYSTEM OWNER','Admin Control','Storage settings and user accounts. Only you can see this section.');
 if(!SUPER)return nod(head,'This section is only for the system owner.');
 if(!ADM){loadAdm();return nod(head,'Loading accounts…')}
 const prov=SET.storage_provider,mb=SET.max_upload_mb;
 const rows=ADM.slice().sort((a,b)=>(a.profile?.full_name||a.email).localeCompare(b.profile?.full_name||b.email)).map(u=>{const p=u.profile||{},off=u.banned||p.active===false;return[`<b>${E(p.full_name||'—')}</b>${u.id===me.id?' <span class="pl">you</span>':''}<div class="m">${E(u.email)}</div>`,E(p.role||'No profile'),E(MRL[u.mrole]||'—'),off?'<span class="badge" style="--c:#DC2626">Deactivated</span>':'<span class="badge" style="--c:#059669">Active</span>',u.last_sign_in_at?fdt(u.last_sign_in_at):'Never',`<button class="clear-btn" onclick="editUser('${u.id}')">Edit</button> <button class="clear-btn" onclick="pwdUser('${u.id}')">Password</button> ${u.id!==me.id?`<button class="clear-btn" onclick="toggleUser('${u.id}')">${off?'Activate':'Deactivate'}</button> <button class="clear-btn bad" onclick="delUser('${u.id}')">Delete</button>`:''}`]});
 return head+`<div class="chart-grid"><div class="chart-card full"><div class="chart-card-title">🗄️ <span>Storage & uploads</span></div>
 <div class="fg"><div><div class="admin-edit-label">Where new files are stored</div><select class="admin-edit-select" id="s_prov"><option value="supabase" ${prov==='supabase'?'selected':''}>Supabase Storage (1 GB on the free plan)</option><option value="oci" ${prov==='oci'?'selected':''}>Oracle Object Storage (20 GB free)</option></select></div>
 <div><div class="admin-edit-label">Maximum upload size (MB)</div><input class="admin-edit-select" id="s_mb" type="number" min="1" max="500" value="${E(mb)}"></div></div>
 <p class="m" style="margin-top:8px">Files already uploaded stay where they are and keep opening normally; only new uploads follow this setting. Supabase's free plan allows at most 50 MB per file. Files larger than the maximum are compressed automatically in the user's browser before they are uploaded.</p>
 <div class="row"><button class="btn-p" onclick="saveStorage()">Save storage settings</button><button class="clear-btn" onclick="testOci()">Test Oracle connection</button></div></div>
 <div class="chart-card full"><div class="row" style="margin:0 0 10px"><div class="chart-card-title" style="margin:0">👥 <span>Accounts</span> (${ADM.length})</div><span class="sp"></span><button class="btn-p" onclick="newUser()">+ New account</button><button class="clear-btn" onclick="ADM=null;draw()">↻ Reload</button></div>${T(['Person','Pulse role','Marketing role','Status','Last sign-in','Actions'],rows)}<p class="m" style="margin-top:6px">Deactivate keeps all history and blocks sign-in. Delete is only possible for people with no campaign or task history.</p></div></div>`}
async function saveStorage(){const p=$('s_prov').value,m=$('s_mb').value;if(p==='oci'&&!confirm('New files will go to Oracle. Make sure the Oracle setup is finished and the connection test passed. Continue?'))return;
 if(!await run(sb.rpc('campaign_set_setting',{p_key:'max_upload_mb',p_value:String(m)})))return;if(await run(sb.rpc('campaign_set_setting',{p_key:'storage_provider',p_value:p}),'Storage settings saved')){await load();draw()}}
async function testOci(){toast('Testing…');const{data,error}=await sb.functions.invoke('oci-media',{body:{action:'ping'}});toast(data&&data.ok?'Oracle connection works':'Oracle test failed: '+((data&&data.error)||(error&&error.message)||'function not deployed'))}
const genPw=()=>{const c='ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789';return Array.from(crypto.getRandomValues(new Uint32Array(12)),v=>c[v%c.length]).join('')};
function userForm(u){const p=u?(u.profile||{}):{},f=(l,i,v,t)=>`<div><div class="admin-edit-label">${l}</div><input class="admin-edit-select" id="${i}" type="${t||'text'}" value="${E(v||'')}"></div>`;
 $('drt').textContent=u?'Edit account':'New account';
 $('drb').innerHTML=`<div class="admin-edit-panel"><div class="fg" style="grid-template-columns:1fr">${f('Email','u_email',u?.email,'email')}${f('Full name (exactly as it should appear)','u_name',p.full_name)}
 <div><div class="admin-edit-label">THORE Pulse role</div><select class="admin-edit-select" id="u_role"><option value="">Choose role</option>${APP_ROLES.map(r=>`<option ${p.role===r?'selected':''}>${E(r)}</option>`).join('')}</select></div>
 <div><div class="admin-edit-label">Marketing Workflow role</div><select class="admin-edit-select" id="u_mrole">${MROLES.map(([k,l])=>`<option value="${k}" ${u&&u.mrole===k?'selected':''}>${l}</option>`).join('')}</select></div>
 ${f('Team Lead (optional)','u_tl',p.team_lead)}${f('Manager (optional)','u_mgr',p.manager)}${f('PNL Head (optional)','u_pnl',p.pnl_head)}${f('Cluster (optional)','u_cl',p.cluster)}
 ${u?'':`<div><div class="admin-edit-label">Password (at least 8 characters)</div><div class="cu" style="max-width:none"><input class="admin-edit-select" id="u_pw" type="text" value="${genPw()}"><button class="clear-btn" onclick="$('u_pw').value=genPw()">New</button></div></div>`}</div>
 <p class="m" style="margin-top:10px">The Pulse role controls what this person sees in THORE Pulse. Changing it affects the whole Pulse system, not only marketing.</p><div class="row"><button class="btn-p" onclick="saveUser('${u?u.id:''}')">${u?'Save changes':'Create account'}</button></div></div>`;$('dr').classList.add('open')}
const uById=id=>ADM.find(x=>x.id===id);
function newUser(){userForm(null)}function editUser(id){userForm(uById(id))}
async function saveUser(id){const b={email:$('u_email').value.trim(),full_name:$('u_name').value.trim(),role:$('u_role').value,mrole:$('u_mrole').value,team_lead:$('u_tl').value.trim(),manager:$('u_mgr').value.trim(),pnl_head:$('u_pnl').value.trim(),cluster:$('u_cl').value.trim()};
 if(!b.email||!b.full_name||!b.role)return toast('Email, name and Pulse role are required');
 if(id){b.id=id;if(b.email===uById(id).email)delete b.email}else{b.password=$('u_pw').value;if(b.password.length<8)return toast('Password must be at least 8 characters')}
 const d=await adm(id?'update':'create',b);if(d){closeDr();ADM=null;draw();if(id)toast('Account updated');else prompt('Account created. Copy this password and share it privately:',b.password)}}
function pwdUser(id){const u=uById(id);$('drt').textContent='Change password';$('drb').innerHTML=`<div class="admin-edit-panel"><div class="admin-edit-title">${E(u.profile?.full_name||u.email)}</div><div class="admin-edit-label">New password (at least 8 characters)</div><div class="cu" style="max-width:none"><input class="admin-edit-select" id="n_pw" type="text" value="${genPw()}"><button class="clear-btn" onclick="$('n_pw').value=genPw()">New</button></div><p class="m" style="margin-top:8px">They can sign in with it straight away. Share it privately.</p><div class="row"><button class="btn-p" onclick="setPwd('${id}')">Set password</button></div></div>`;$('dr').classList.add('open')}
async function setPwd(id){const pw=$('n_pw').value;if(pw.length<8)return toast('Password must be at least 8 characters');if(await adm('set_password',{id,password:pw})){closeDr();prompt('Password changed. Copy it and share it privately:',pw)}}
async function toggleUser(id){const u=uById(id),off=u.banned||u.profile?.active===false;if(!confirm((off?'Activate ':'Deactivate ')+(u.profile?.full_name||u.email)+'?'))return;if(await adm('update',{id,active:off})){toast(off?'Account activated':'Account deactivated');ADM=null;draw()}}
async function delUser(id){const u=uById(id),t=prompt('This permanently deletes the account of '+(u.profile?.full_name||u.email)+'. It only works for people with no campaign or task history.\nType their email to confirm:');if(t!==u.email)return t===null?0:toast('Delete cancelled');if(await adm('delete',{id,email:u.email})){toast('Account deleted');ADM=null;draw()}}
</script></body></html>
