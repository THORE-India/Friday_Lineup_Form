 return head+`<div class="rc">${a.length} campaign(s)</div><div class="bd">`+ALL.filter(s=>cnt(a,s)||(role!=='executive'&&role!=='designer'&&ST.includes(s))).map(s=>`<div class="cl" style="--c:${COL[s]}"><h3>${LB[s]}<span>${cnt(a,s)}</span></h3>${a.filter(x=>x.status===s).map(x=>{const q=rq(x);return`<div class="cd ${pend(x)?'hl':''}" style="--c:${COL[s]}" onclick="open_('${x.id}')">${pend(x)?TAG:''}<b>${E(x.name||x.ref)}</b><span class="pl">${E(x.targeting||x.ctype)}</span><span class="pl">${E(x.region||'')}</span><div class="m" style="margin-top:5px">${x.executive_id?`<span class="av">${ini(x.executive_id)}</span>`:'Unassigned'} ${q.deadline&&q.deadline<t&&!['verified','cancelled'].includes(s)?'<span class="late">overdue</span>':E(q.zone||'')}</div></div>`}).join('')}</div>`).join('')+'</div>'}
/* ---------- requests ---------- */
function tgl(id){OPENR.has(id)?OPENR.delete(id):OPENR.add(id);draw()}
const cTable=it=>`<div style="margin-top:12px">${T(['Campaign','Type','Targeting','Region','Status','Executive','Designer'],it.map(x=>[`<a href="#" style="color:var(--gold);font-weight:600" onclick="open_('${x.id}');return false">${E(x.name||x.ref)}</a>`,E(x.ctype),E(x.targeting||''),E(x.region||''),chip(x.status)+(pend(x)?' '+TAG:''),x.executive_id?`<span class="av">${ini(x.executive_id)}</span>${E(nm(x.executive_id))}`:'Unassigned',x.designer_id?E(nm(x.designer_id)):'—']))}</div>`;
function reqs(){const L=FR(),head=sh('PROJECT REQUESTS','Requests','Click a project to see all its campaigns, status and executive.');if(!L.length)return head+'<div class="chart-grid"><div class="chart-card full no-data">No requests match these filters.</div></div>';
 return head+`<div class="rc">${L.length} request(s)</div><div class="rq-list">`+L.map(r=>{const it=I.filter(x=>x.request_id===r.id),h=it.some(x=>x.status==='on_hold'),ls=Array.isArray(r.quantities)?r.quantities.map(l=>`${l.ctype} · ${l.targeting} · ${l.region} ×${l.n}`):Object.entries(r.quantities||{}).map(([k,v])=>k+' ×'+v);
 return`<div class="chart-card"><div class="row" style="margin:0"><b style="font-size:1rem;cursor:pointer" onclick="tgl('${r.id}')">${E(r.project_name)} ${OPENR.has(r.id)?'▾':'▸'}</b><span class="pl">${E(r.ref)}</span><span class="sp"></span><span class="m">Deadline ${E(r.deadline||'—')} · ${dl(r.deadline)}</span></div>
 <div class="m" style="margin:4px 0 8px">${E(r.developer||'')}</div><span class="badge" style="--c:#1E40AF">${E(r.zone)}</span> <span class="pl">${E(r.cluster||'')}</span><span class="pl">${E(r.city||'')}</span>
 <div style="margin:8px 0">${(r.config_list||[]).map(c=>`<span class="pl">${E(c.config)} · ${E(c.area)} sqft · ${E(c.price)}</span>`).join('')}</div><div class="m">${E(r.key_points||'')}</div><div style="margin:10px 0 4px">${seg(it)}</div>
 <div class="m">${cnt(it,'verified')} of ${it.length-cnt(it,'cancelled')} completed · ${ls.map(E).join(' | ')}</div>${OPENR.has(r.id)?cTable(it.filter(itm)):''}
 <div class="row"><button class="btn-p" onclick="tgl('${r.id}')">${OPENR.has(r.id)?'Hide':'View'} campaigns (${it.length})</button>${mgr()?`<button class="clear-btn" onclick="editReq('${r.id}')">Edit</button><button class="clear-btn" onclick="setState('request','${r.id}','${h?'resume':'hold'}')">${h?'Resume all':'Put on hold'}</button><button class="clear-btn bad" onclick="setState('request','${r.id}','cancel')">Cancel request</button>`:''}${role==='head'?`<button class="clear-btn bad" onclick="closeReq('${r.id}')">Export and close</button>`:''}</div></div>`}).join('')+'</div>'}
/* ---------- new request ---------- */
function editReq(id){EDIT=id;tab='new';draw()}
function form(){if(!mgr())return sh('NEW REQUEST','New Request','')+'<div class="chart-grid"><div class="chart-card full no-data">Only the marketing manager or head can create requests.</div></div>';
 OPT={types:[...CTYPES],tg:[...TARGET],rg:[...REGIONS]};SEL={types:new Set(),tg:new Set(),rg:new Set()};if(!EDIT){CFG=[{config:'',area:'',price:''}];LINES=[]}
 const sel=(i,o,ph)=>`<select class="admin-edit-select" id="${i}"><option value="">${ph}</option>${o.map(v=>`<option>${v}</option>`).join('')}</select>`,f=(l,c)=>`<div><div class="admin-edit-label">${l}</div>${c}</div>`;
 return sh(EDIT?'EDIT REQUEST':'NEW REQUEST',EDIT?'Edit Request':'New Campaign Request','Fill in the project details, then add the campaigns required.')+`<div class="fm">
 <div class="chart-card"><div class="chart-card-title">1 · <span>Project</span></div><div class="fg">${f('Zone',sel('zone',ZONES,'Select zone'))}${f('Cluster',sel('cluster',CLUSTERS,'Select cluster'))}
 ${f('City',`<input class="admin-edit-select" id="city" list="cl" placeholder="Type or choose"><datalist id="cl">${CITIES.map(c=>`<option>${c}</option>`).join('')}</datalist>`)}
 ${f('Project name',`<input class="admin-edit-select" id="project_name" list="pl" oninput="$('developer').value=pmMap[this.value]||''" placeholder="Search project"><datalist id="pl">${PM.map(p=>`<option value="${E(p)}">`).join('')}</datalist>`)}
 ${f('Developer (automatic)','<input class="admin-edit-select" id="developer" readonly>')}${f('Project deadline','<input class="admin-edit-select" id="deadline" type="date">')}</div></div>
 <div class="chart-card"><div class="chart-card-title">2 · <span>Configurations and prices</span></div><div id="cfg"></div><button class="clear-btn" onclick="CFG.push({config:'',area:'',price:''});drawCfg()">+ Add configuration</button></div>
 <div class="chart-card"><div class="chart-card-title">3 · <span>Key points</span></div><textarea class="admin-edit-textarea" id="key_points"></textarea></div>
 <div class="chart-card" id="tw"><div class="chart-card-title">4 · <span>Campaigns</span></div><p class="m" style="margin-bottom:8px">Choose one or more in each group, set the number, then add. 2 types × 2 targeting × 3 regions adds 12 lines at once.</p>
 <div class="admin-edit-label">Campaign type</div><div id="g_types" class="chips"></div><div class="cu"><input class="admin-edit-select" id="c_types" placeholder="Custom type"><button class="clear-btn" onclick="addCu('types')">Add</button></div>
 <div class="admin-edit-label" style="margin-top:12px">Targeting</div><div id="g_tg" class="chips"></div>
 <div class="admin-edit-label" style="margin-top:12px">Targeting region</div><div id="g_rg" class="chips"></div><div class="cu"><input class="admin-edit-select" id="c_rg" placeholder="Custom region"><button class="clear-btn" onclick="addCu('rg')">Add</button></div>
 <div class="row" style="align-items:flex-end"><div><div class="admin-edit-label">Number for each combination</div><input class="admin-edit-select" id="cnt" type="number" min="1" value="1" style="width:100px"></div><button class="btn-p" onclick="addLines()">Add to list</button><span class="m" id="pv"></span></div><div id="ln" style="margin-top:12px"></div></div>
 <button class="btn-p" style="height:36px;padding:0 22px" onclick="submitReq()">${EDIT?'Save changes':'Create request'}</button></div>`}
function fill(){const r=R.find(x=>x.id===EDIT);['zone','cluster','city','project_name','developer','deadline','key_points'].forEach(k=>$(k).value=r[k]||'');CFG=(r.config_list||[]).length?JSON.parse(JSON.stringify(r.config_list)):[{config:'',area:'',price:''}];$('tw').style.display='none'}
function drawCfg(){$('cfg').innerHTML=CFG.map((c,i)=>`<div class="g3"><input class="admin-edit-select" placeholder="Configuration (e.g. 2 BHK)" value="${E(c.config)}" oninput="CFG[${i}].config=this.value"><input class="admin-edit-select" type="number" placeholder="Area (sqft)" value="${E(c.area)}" oninput="CFG[${i}].area=this.value"><input class="admin-edit-select" placeholder="Price (e.g. 1.2 Cr)" value="${E(c.price)}" oninput="CFG[${i}].price=this.value"><button class="clear-btn bad" onclick="CFG.splice(${i},1);drawCfg()">✕</button></div>`).join('')}
function drawCh(g){$('g_'+g).innerHTML=OPT[g].map(o=>`<span class="ch ${SEL[g].has(o)?'on':''}" data-v="${E(o)}" onclick="tog('${g}',this.dataset.v)">${E(o)}</span>`).join('');const n=SEL.types.size*SEL.tg.size*SEL.rg.size;$('pv').textContent=n?n+' line(s) will be added':''}
function tog(g,v){SEL[g].has(v)?SEL[g].delete(v):SEL[g].add(v);['types','tg','rg'].forEach(drawCh)}
function addCu(g){const v=$('c_'+g).value.trim();if(!v)return;if(!OPT[g].includes(v))OPT[g].push(v);SEL[g].add(v);$('c_'+g).value='';drawCh(g)}
function addLines(){const n=+$('cnt').value;if(!(n>=1))return toast('Enter a number of campaigns');if(!SEL.types.size||!SEL.tg.size||!SEL.rg.size)return toast('Pick at least one type, one targeting and one region');
 SEL.types.forEach(c=>SEL.tg.forEach(t=>SEL.rg.forEach(r=>{const l=LINES.find(x=>x.ctype===c&&x.targeting===t&&x.region===r);l?l.n+=n:LINES.push({ctype:c,targeting:t,region:r,n})})));
 ['types','tg','rg'].forEach(g=>SEL[g].clear());['types','tg','rg'].forEach(drawCh);drawLines()}
function drawLines(){const t=LINES.reduce((s,l)=>s+l.n,0);$('ln').innerHTML=LINES.length?`<table><thead><tr><th>Type</th><th>Targeting</th><th>Region</th><th>Number</th><th></th></tr></thead><tbody>${LINES.map((l,i)=>`<tr><td>${E(l.ctype)}</td><td>${E(l.targeting)}</td><td>${E(l.region)}</td><td><input class="admin-edit-select" type="number" min="1" value="${l.n}" style="width:80px" onchange="LINES[${i}].n=Math.max(1,+this.value||1);drawLines()"></td><td><button class="clear-btn bad" onclick="LINES.splice(${i},1);drawLines()">✕</button></td></tr>`).join('')}</tbody></table><p style="margin-top:8px;font-size:.8rem"><b>${t}</b> campaigns in total</p>`:'<p class="m">No campaigns added yet.</p>'}
async function submitReq(){const p={zone:$('zone').value,cluster:$('cluster').value,city:$('city').value.trim(),project_name:$('project_name').value.trim(),developer:$('developer').value,deadline:$('deadline').value,key_points:$('key_points').value,config_list:CFG.filter(c=>c.config.trim())};
 if(!p.zone||!p.cluster||!p.city||!p.project_name||!p.deadline)return toast('Zone, cluster, city, project and deadline are required');
 if(!EDIT&&PM.length&&!(p.project_name in pmMap))return toast('Pick the project from the list');
 if(EDIT){if(await run(sb.rpc('campaign_update_request',{p_req:EDIT,p}),'Request updated')){EDIT=null;tab='reqs';load()}return}
 if(!LINES.length)return toast('Add at least one campaign');p.lines=LINES;
 if(await run(sb.rpc('campaign_create_request',{p}),'Request created')){tab='board';load()}}
/* ---------- campaign slide-over ---------- */
function closeDr(){$('dr').classList.remove('open');curItem=null}
function open_(id){curItem=id;if(!I.find(i=>i.id===id))return toast('That campaign is no longer available to you');const x=I.find(i=>i.id===id),q=rq(x),d=x.data||{},w=WHO[x.status],exe=x.executive_id===me.id,
 can=w==='e'?exe:w==='d'?x.designer_id===me.id:w==='z'?Z.some(a=>a.zone===q.zone&&a.approver_id===me.id):mgr(),as=mgr()&&['brief','designing'].includes(x.status),
 opt=(r,v)=>`<option value="">Unassigned</option>`+P.filter(p=>p.role===r).map(p=>`<option value="${p.user_id}" ${p.user_id===v?'selected':''}>${E(p.profiles?.full_name)}</option>`).join(''),
 ed=(k,l,on)=>on?`<div class="admin-edit-label" style="margin-top:10px">${l}</div><textarea class="admin-edit-textarea" id="f_${k}">${E(d[k]||'')}</textarea>`:di(l,d[k],1),
 files=[...x.campaign_assets].sort((a,b)=>a.version-b.version);
 $('drt').textContent=x.name||x.ref;
 $('drb').innerHTML=`<div class="row" style="margin:0 0 12px">${chip(x.status)}${pend(x)?TAG:''}<span class="pl">${E(x.ref)}</span><span class="pl">${E(x.targeting||'')}</span><span class="pl">${E(x.region||'')}</span></div>
 <div class="detail-grid">${di('Project',q.project_name)}${di('Developer',q.developer)}${di('Zone',q.zone)}${di('Cluster',q.cluster)}${di('City',q.city)}${di('Deadline',E(q.deadline||'—')+' · '+dl(q.deadline),0,1)}${di('Configurations',(q.config_list||[]).map(c=>`${E(c.config)} · ${E(c.area)} sqft · ${E(c.price)}`).join('<br>'),1,1)}${di('Key points',q.key_points,1)}
 ${di('Executive',x.executive_id?nm(x.executive_id):'Unassigned')}${di('Designer',x.designer_id?nm(x.designer_id):'Unassigned')}</div>
 ${as?`<div class="admin-edit-panel"><div class="admin-edit-title">👥 Assignment</div><div class="admin-edit-label">Executive</div><select class="admin-edit-select" id="ae">${opt('executive',x.executive_id)}</select><div class="admin-edit-label" style="margin-top:10px">Designer</div><select class="admin-edit-select" id="ad">${opt('designer',x.designer_id)}</select><div class="row"><button class="btn-p" onclick="assign('${id}')">Save assignment</button></div></div>`:''}
 <div class="admin-edit-panel"><div class="admin-edit-title">📝 Work</div>${ed('brief','Brief (objective, audience, offer, format)',exe&&x.status==='brief')}${ed('content','Campaign content (texts, headlines, CTA, link)',exe&&x.status==='content')}${ed('setup','Setup confirmation (platform, campaign link)',exe&&x.status==='approved')}
 <div class="admin-edit-label" style="margin-top:10px">Creative files</div>${files.map(a=>`<div class="log"><a href="#" onclick="view('${a.path}');return false">v${a.version} ${E(a.filename)}</a> ${E(a.note||'')}</div>`).join('')||'<div class="m">None yet</div>'}
 ${x.designer_id===me.id&&x.status==='designing'?`<input class="admin-edit-select" type="file" id="file" accept="image/*,video/mp4,application/pdf" style="margin-top:8px"><input class="admin-edit-select" id="note" placeholder="What changed?" style="margin-top:6px"><div class="row"><button class="clear-btn" onclick="upload('${id}')">Upload new version</button></div>`:''}
 ${can&&NX[x.status]?`<div class="admin-edit-label" style="margin-top:12px">Comment ${NX[x.status].some(n=>n[2])?'(required when sending back)':''}</div><textarea class="admin-edit-textarea" id="cm"></textarea><div class="row">${['brief','content','approved'].includes(x.status)&&exe?`<button class="clear-btn" onclick="act('${id}','${x.status}')">Save draft</button>`:''}${NX[x.status].map(n=>`<button class="${n[2]?'clear-btn bad':'btn-p'}" onclick="act('${id}','${n[0]}')">${n[1]}</button>`).join('')}</div>`:''}
 ${mgr()&&!['verified','cancelled'].includes(x.status)?`<div class="row"><button class="clear-btn" onclick="setState('item','${id}','${x.status==='on_hold'?'resume':'hold'}')">${x.status==='on_hold'?'Resume':'Put on hold'}</button><button class="clear-btn bad" onclick="setState('item','${id}','cancel')">Cancel campaign</button></div>`:''}${x.state_reason?`<p class="m" style="margin-top:8px">Reason: ${E(x.state_reason)}</p>`:''}</div><div id="lg"></div>`;$('dr').classList.add('open');
 sb.from('campaign_activity').select('*').eq('item_id',id).order('at').then(({data})=>$('lg').innerHTML='<div class="admin-edit-label" style="margin-top:14px">History</div>'+(data||[]).map(a=>`<div class="log">${new Date(a.at).toLocaleString('en-IN')} · ${E(nm(a.actor))} · ${a.from_status?LB[a.from_status]+' → '+LB[a.to_status]:''} ${E(a.comment||'')}</div>`).join(''))}
async function act(id,to){const d={};['brief','content','setup'].forEach(k=>{const e=$('f_'+k);if(e)d[k]=e.value});
 if(await run(sb.rpc('campaign_advance',{p_item:id,p_to:to,p_comment:$('cm')?.value||null,p_data:d}),'Saved')){await load();open_(id)}}
async function assign(id){if(await run(sb.rpc('campaign_assign',{p_item:id,p_exec:$('ae').value||null,p_designer:$('ad').value||null}),'Assignment saved')){await load();open_(id)}}
async function setState(k,id,a){const r=a==='resume'?null:prompt(a==='cancel'?'Reason for cancelling (required). This cannot be undone:':'Reason for putting on hold (required):');
 if(a!=='resume'&&!(r||'').trim())return;if(await run(sb.rpc('campaign_set_state',{p_kind:k,p_id:id,p_action:a,p_reason:r}),'Updated')){await load();if(k==='item')open_(id)}}
async function upload(id){const f=$('file').files[0];if(!f)return toast('Choose a file first');if(f.size>20*1048576)return toast('Files can be 20 MB at most');
 const x=I.find(i=>i.id===id),v=x.campaign_assets.length+1,path=`${id}/v${v}/${f.name.replace(/[^\w.\-]/g,'_')}`;
 if(!await run(sb.storage.from(B).upload(path,f,{contentType:f.type})))return;
 if(await run(sb.from('campaign_assets').insert({item_id:id,version:v,path,filename:f.name,mime:f.type,size_bytes:f.size,note:$('note').value}),'Uploaded')){await load();open_(id)}}
async function view(p){const r=await sb.storage.from(B).createSignedUrl(p,300);if(r.data)window.open(r.data.signedUrl);else toast(r.error.message)}
async function closeReq(id){const r=R.find(x=>x.id===id);
 if(prompt(`This permanently deletes all campaign data and files for "${r.project_name}". A JSON backup downloads first.\nType the project name to confirm:`)!==r.project_name)return toast('Close cancelled');
 const ids=I.filter(x=>x.request_id===id).map(x=>x.id),a=(await sb.from('campaign_activity').select('*').in('item_id',ids)).data||[];
 const url=URL.createObjectURL(new Blob([JSON.stringify({request:r,items:I.filter(x=>x.request_id===id),activity:a},null,1)],{type:'application/json'}));
 Object.assign(document.createElement('a'),{href:url,download:r.ref+'.json'}).click();
 const paths=await run(sb.rpc('campaign_prepare_close',{p_req:id}));if(!paths)return;
 for(let i=0;i<paths.length;i+=50){if(!await run(sb.storage.from(B).remove(paths.slice(i,i+50))))return}
 if(await run(sb.rpc('campaign_purge',{p_req:id}),'Closed. All campaign data deleted'))await load()}
</script></body></html>
