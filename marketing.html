 ed=(k,l,on)=>on?`<div class="admin-edit-label" style="margin-top:10px">${l}</div><textarea class="admin-edit-textarea" id="f_${k}">${E(d[k]||'')}</textarea>`:di(l,d[k],1),files=[...x.campaign_assets].sort((a,b)=>a.version-b.version),nx=NX[x.status]&&x.opt_active&&x.status==='approval'?[['verified','Approve and close optimization'],['content','Changes to content',1],['designing','Changes to creative',1]]:x.opt_active&&x.status==='exec_review'&&!(d.opt&&d.opt.content)?[['approval','Accept creative, send to manager'],['designing','Request changes',1]]:NX[x.status];
 $('drt').innerHTML=cname(x);
 $('drb').innerHTML=`<div class="row" style="margin:0 0 12px">${chip(x.status)}${pend(x)?TAG:''}<span class="pl">${E(x.ref)}</span><span class="pl">${E(x.subtype||'')}</span><span class="pl">${E(x.targeting||'')}</span><span class="pl">${E(x.region||'')}</span><span class="sp"></span><button class="clear-btn" onclick="openHelp('${x.status}',${x.opt_active?1:0})">❓ Help for this stage</button></div>
 <div class="detail-grid">${di('Project',q.project_name)}${di('Developer',q.developer)}${di('Zone',q.zone)}${di('Cluster',q.cluster)}${di('City',q.city)}${di('Deadline',E(q.deadline||'—')+' · '+dl(q.deadline),0,1)}${di('Configurations',(q.config_list||[]).map(c=>`${E(c.config)} · ${E(c.area)} sqft · ${E(c.price)}`).join('<br>'),1,1)}<div class="detail-item full"><div class="detail-label">Key points</div><div class="detail-value" style="white-space:pre-line">${E(q.key_points||'—')}</div></div>${di('Executive',x.executive_id?nm(x.executive_id):'Unassigned')}${di('Designer',x.designer_id?nm(x.designer_id):'Unassigned')}</div>
 ${x.opt_active&&d.opt?`<div class="admin-edit-panel" style="border-color:#C4B5FD"><div class="admin-edit-title" style="color:#7C3AED">🛠️ Optimization #${d.opt.n} in progress</div><div class="detail-grid">${d.opt.design?di('Design changes',d.opt.design_notes,1):''}${d.opt.content?di('Content / other changes',d.opt.content_notes,1):''}</div></div>`:''}
 ${canAs?`<div class="admin-edit-panel"><div class="admin-edit-title">👥 Assignment (can be changed at any stage)</div><div class="admin-edit-label">Executive</div><select class="admin-edit-select" id="ae">${optsel(execs(),x.executive_id,'Unassigned')}</select><div class="admin-edit-label" style="margin-top:10px">Designer</div><select class="admin-edit-select" id="ad">${optsel(designers(),x.designer_id,'Unassigned')}</select><div class="row"><button class="btn-p" onclick="assign('${id}')">Save assignment</button></div></div>`:''}
 <div class="admin-edit-panel"><div class="admin-edit-title">📝 Work</div>${ed('brief','Brief (objective, audience, offer, format)',exe&&x.status==='brief')}${ed('content','Campaign content (texts, headlines, CTA, link)',exe&&x.status==='content')}${ed('setup','Setup confirmation (platform, campaign link)',exe&&x.status==='approved')}
 <div class="admin-edit-label" style="margin-top:10px">Creative files</div>${files.map(a=>`<div class="log"><a href="#" onclick="view('${a.id}');return false">v${a.version} ${E(a.filename)}</a> ${E(a.note||'')} <span class="m">· ${fdt(a.uploaded_at)} · ${E(nm(a.uploaded_by))}</span></div>`).join('')||'<div class="m">None yet</div>'}
 ${x.designer_id===me.id&&x.status==='designing'?`<input class="admin-edit-select" type="file" id="file" accept="image/*,video/mp4,application/pdf" style="margin-top:8px"><input class="admin-edit-select" id="note" placeholder="What changed?" style="margin-top:6px"><div class="row"><button class="clear-btn" onclick="upload('${id}')">Upload new version</button></div>`:''}
 ${can&&nx?`<div class="admin-edit-label" style="margin-top:12px">Comment ${nx.some(n=>n[2])?'(required when sending back)':''}</div><textarea class="admin-edit-textarea" id="cm"></textarea><div class="row">${['brief','content','approved'].includes(x.status)&&exe?`<button class="clear-btn" onclick="act('${id}','${x.status}')">Save draft</button>`:''}${nx.map(n=>`<button class="${n[2]?'clear-btn bad':'btn-p'}" onclick="act('${id}','${n[0]}')">${n[1]}</button>`).join('')}</div>`:''}
 ${mgr()&&!['verified','cancelled'].includes(x.status)?`<div class="row"><button class="clear-btn" onclick="setState('item','${id}','${x.status==='on_hold'?'resume':'hold'}')">${x.status==='on_hold'?'Resume':'Put on hold'}</button><button class="clear-btn bad" onclick="setState('item','${id}','cancel')">Cancel campaign</button></div>`:''}
 ${mgr()&&x.status==='verified'&&pst(q)!=='cancelled'?`<div class="row"><button class="btn-p" onclick="startOpt('${id}')">🛠️ Create optimization request</button></div>`:''}${x.state_reason?`<p class="m" style="margin-top:8px">Reason: ${E(x.state_reason)}</p>`:''}</div>
 ${(d.opt_history||[]).length?`<div class="admin-edit-label" style="margin-top:14px">Optimization history</div>${d.opt_history.map(o=>`<div class="log">#${o.n} · ${fdt(o.at)} · ${E(nm(o.by))}${o.design?' · Design: '+E(o.design_notes):''}${o.content?' · Content: '+E(o.content_notes):''}</div>`).join('')}`:''}<div id="lg"></div>`;$('dr').classList.add('open');
 Promise.all([sb.from('campaign_activity').select('*').eq('item_id',id).order('at'),sb.from('campaign_audit').select('*').eq('item_id',id).order('at',{ascending:false}).limit(80)]).then(([ac,au])=>{if(curItem!==id)return;$('lg').innerHTML='<div class="admin-edit-label" style="margin-top:14px">History</div>'+(ac.data||[]).map(a=>`<div class="log">${fdt(a.at)} · ${E(nm(a.actor))} · ${a.from_status?LB[a.from_status]+' → '+LB[a.to_status]:''} ${E(a.comment||'')}</div>`).join('')+`<details style="margin-top:10px"><summary class="admin-edit-label" style="cursor:pointer">Audit trail (every recorded change)</summary>${(au.data||[]).map(a=>`<div class="log">${fdt(a.at)} · <b>${E(a.actor_name||nm(a.actor))}</b> · ${E(chg(a))}</div>`).join('')||'<div class="m">Nothing recorded yet</div>'}</details>`})}
async function act(id,to){const d={};['brief','content','setup'].forEach(k=>{const e=$('f_'+k);if(e)d[k]=e.value});
 if(await run(sb.rpc('campaign_advance',{p_item:id,p_to:to,p_comment:$('cm')?.value||null,p_data:d}),'Saved')){await load();open_(id)}}
async function assign(id){if(await run(sb.rpc('campaign_assign',{p_item:id,p_exec:$('ae').value||null,p_designer:$('ad').value||null}),'Assignment saved')){await load();open_(id)}}
async function setState(k,id,a){const r=a==='resume'?null:prompt(a==='cancel'?'Reason for cancelling (required). This cannot be undone:':'Reason for putting on hold (required):');
 if(a!=='resume'&&!(r||'').trim())return;if(await run(sb.rpc('campaign_set_state',{p_kind:k,p_id:id,p_action:a,p_reason:r}),'Updated')){await load();if(k==='item')open_(id)}}
/* ---- files: Oracle Object Storage (legacy Supabase files still open) ---- */
const USE_OCI=true,OCI_FN='oci-media',MAXMB=200;
async function upload(id){const f=$('file').files[0];if(!f)return toast('Choose a file first');if(f.size>MAXMB*1048576)return toast('Files can be '+MAXMB+' MB at most');
 const x=I.find(i=>i.id===id),v=x.campaign_assets.length+1;let row;toast('Uploading…');
 if(USE_OCI){const{data,error}=await sb.functions.invoke(OCI_FN,{body:{action:'upload',item_id:id,filename:f.name,content_type:f.type,version:v}});
  if(error||!data||data.error)return toast('Upload could not start: '+(data?.error||error?.message||'unknown'));
  let put;try{put=await fetch(data.upload_url,{method:'PUT',headers:{'Content-Type':f.type||'application/octet-stream'},body:f})}catch(e){return toast('Upload blocked by the browser (CORS). See the setup guide, step E4.')}
  if(!put.ok)return toast('Oracle rejected the upload ('+put.status+')');
  row={item_id:id,version:v,path:data.object_name,provider:'oci',oci_url:data.object_url,filename:f.name,mime:f.type,size_bytes:f.size,note:$('note').value}}
 else{const path=`${id}/v${v}/${f.name.replace(/[^\w.\-]/g,'_')}`;if(!await run(sb.storage.from(B).upload(path,f,{contentType:f.type})))return;row={item_id:id,version:v,path,filename:f.name,mime:f.type,size_bytes:f.size,note:$('note').value}}
 if(await run(sb.from('campaign_assets').insert(row),'Uploaded')){await load();open_(id)}}
async function view(aid){const a=I.flatMap(x=>x.campaign_assets).find(y=>y.id===aid);if(!a)return;
 if(a.provider==='oci'){const{data,error}=await sb.functions.invoke(OCI_FN,{body:{action:'download',asset_id:aid}});if(error||!data||data.error)return toast('Could not open file: '+(data?.error||error?.message||'unknown'));window.open(data.url)}
 else{const r=await sb.storage.from(B).createSignedUrl(a.path,300);if(r.data)window.open(r.data.signedUrl);else toast(r.error.message)}}
</script></body></html>
