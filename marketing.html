 <div class="sec"><h2><i>1</i>Project</h2><div class="g"><div><label>Zone</label>${sel('zone',ZONES,'Select zone')}</div><div><label>Cluster</label>${sel('cluster',CLUSTERS,'Select cluster')}</div>
 <div><label>City</label><input id="city" list="cl" placeholder="Type or choose"><datalist id="cl">${CITIES.map(c=>`<option>${c}</option>`).join('')}</datalist></div>
 <div><label>Project name</label><input id="project_name" list="pl" oninput="$('developer').value=pmMap[this.value]||''" placeholder="Search project"><datalist id="pl">${PM.map(p=>`<option value="${E(p)}">`).join('')}</datalist></div>
 <div><label>Developer (filled automatically)</label><input id="developer" readonly></div><div><label>Project deadline</label><input id="deadline" type="date"></div></div></div>
 <div class="sec"><h2><i>2</i>Configurations and prices</h2><div id="cfg"></div><button class="btn sm" onclick="CFG.push({config:'',area:'',price:''});drawCfg()">+ Add configuration</button></div>
 <div class="sec"><h2><i>3</i>Key points</h2><textarea id="key_points"></textarea></div>
 <div class="sec" id="tw"><h2><i>4</i>Campaigns</h2><p class="m">Choose one or more in each group, set the number, then add. 2 types × 2 targeting × 3 regions adds 12 lines at once.</p>
 <label>Campaign type</label><div id="g_types" class="chips"></div><div class="cu"><input id="c_types" placeholder="Custom type"><button class="btn sm" onclick="addCu('types')">Add</button></div>
 <label>Targeting</label><div id="g_tg" class="chips"></div><label>Targeting region</label><div id="g_rg" class="chips"></div><div class="cu"><input id="c_rg" placeholder="Custom region"><button class="btn sm" onclick="addCu('rg')">Add</button></div>
 <div class="row"><div><label>Number for each combination</label><input id="cnt" type="number" min="1" value="1" style="width:100px"></div><button class="btn pri" onclick="addLines()">Add to list</button><span class="m" id="pv"></span></div><div id="ln" style="margin-top:12px"></div></div>
 <button class="btn pri" onclick="submitReq()">${EDIT?'Save changes':'Create request'}</button></div>`}
function fill(){const r=R.find(x=>x.id===EDIT);['zone','cluster','city','project_name','developer','deadline','key_points'].forEach(k=>$(k).value=r[k]||'');CFG=(r.config_list||[]).length?JSON.parse(JSON.stringify(r.config_list)):[{config:'',area:'',price:''}];$('tw').style.display='none'}
function drawCfg(){$('cfg').innerHTML=CFG.map((c,i)=>`<div class="g3"><input placeholder="Configuration (e.g. 2 BHK)" value="${E(c.config)}" oninput="CFG[${i}].config=this.value"><input type="number" placeholder="Area (sqft)" value="${E(c.area)}" oninput="CFG[${i}].area=this.value"><input placeholder="Price (e.g. 1.2 Cr)" value="${E(c.price)}" oninput="CFG[${i}].price=this.value"><button class="btn sm bad" onclick="CFG.splice(${i},1);drawCfg()">✕</button></div>`).join('')}
function drawCh(g){$('g_'+g).innerHTML=OPT[g].map(o=>`<span class="ch ${SEL[g].has(o)?'on':''}" data-v="${E(o)}" onclick="tog('${g}',this.dataset.v)">${E(o)}</span>`).join('');const n=SEL.types.size*SEL.tg.size*SEL.rg.size;$('pv').textContent=n?n+' line(s) will be added':''}
function tog(g,v){SEL[g].has(v)?SEL[g].delete(v):SEL[g].add(v);['types','tg','rg'].forEach(drawCh)}
function addCu(g){const v=$('c_'+g).value.trim();if(!v)return;if(!OPT[g].includes(v))OPT[g].push(v);SEL[g].add(v);$('c_'+g).value='';drawCh(g)}
function addLines(){const n=+$('cnt').value;if(!(n>=1))return toast('Enter a number of campaigns');if(!SEL.types.size||!SEL.tg.size||!SEL.rg.size)return toast('Pick at least one type, one targeting and one region');
 SEL.types.forEach(c=>SEL.tg.forEach(t=>SEL.rg.forEach(r=>{const l=LINES.find(x=>x.ctype===c&&x.targeting===t&&x.region===r);l?l.n+=n:LINES.push({ctype:c,targeting:t,region:r,n})})));
 ['types','tg','rg'].forEach(g=>SEL[g].clear());['types','tg','rg'].forEach(drawCh);drawLines()}
function drawLines(){const t=LINES.reduce((s,l)=>s+l.n,0);$('ln').innerHTML=LINES.length?`<table><tr><th>Type</th><th>Targeting</th><th>Region</th><th>Number</th><th></th></tr>${LINES.map((l,i)=>`<tr><td>${E(l.ctype)}</td><td>${E(l.targeting)}</td><td>${E(l.region)}</td><td><input type="number" min="1" value="${l.n}" style="width:80px" onchange="LINES[${i}].n=Math.max(1,+this.value||1);drawLines()"></td><td><button class="btn sm bad" onclick="LINES.splice(${i},1);drawLines()">✕</button></td></tr>`).join('')}</table><p style="margin-top:8px"><b>${t}</b> campaigns in total</p>`:'<p class="m">No campaigns added yet.</p>'}
async function submitReq(){const p={zone:$('zone').value,cluster:$('cluster').value,city:$('city').value.trim(),project_name:$('project_name').value.trim(),developer:$('developer').value,deadline:$('deadline').value,key_points:$('key_points').value,config_list:CFG.filter(c=>c.config.trim())};
 if(!p.zone||!p.cluster||!p.city||!p.project_name||!p.deadline)return toast('Zone, cluster, city, project and deadline are required');
 if(!EDIT&&PM.length&&!(p.project_name in pmMap))return toast('Pick the project from the list');
 if(EDIT){if(await run(sb.rpc('campaign_update_request',{p_req:EDIT,p}),'Request updated')){EDIT=null;tab='reqs';load()}return}
 if(!LINES.length)return toast('Add at least one campaign');p.lines=LINES;
 if(await run(sb.rpc('campaign_create_request',{p}),'Request created')){tab='board';load()}}
/* ---------- campaign drawer ---------- */
function open_(id){const x=I.find(i=>i.id===id),q=rq(x),d=x.data||{},w=WHO[x.status],exe=x.executive_id===me.id,
 can=w==='e'?exe:w==='d'?x.designer_id===me.id:w==='z'?Z.some(a=>a.zone===q.zone&&a.approver_id===me.id):mgr(),as=mgr()&&['brief','designing'].includes(x.status),
 opt=(r,v)=>`<option value="">Unassigned</option>`+P.filter(p=>p.role===r).map(p=>`<option value="${p.user_id}" ${p.user_id===v?'selected':''}>${E(p.profiles?.full_name)}</option>`).join(''),
 ed=(k,l,on)=>`<label>${l}</label>`+(on?`<textarea id="f_${k}">${E(d[k]||'')}</textarea>`:`<div class="rd">${E(d[k]||'—')}</div>`);
 $('dr').innerHTML=`<div class="row" style="margin:0"><b style="font-size:1rem">${E(x.name||x.ref)}</b><span class="sp"></span><button class="btn" onclick="$('dr').classList.remove('on')">Close</button></div>
 <p style="margin:8px 0"><span class="st" style="--c:${COL[x.status]}">${LB[x.status]}</span> <span class="pl">${E(x.ref)}</span><span class="pl">${E(x.targeting||'')}</span><span class="pl">${E(x.region||'')}</span></p>
 <div class="rd"><b>${E(q.project_name)}</b> · ${E(q.developer||'')}\n${E(q.zone)} · ${E(q.cluster||'')} · ${E(q.city||'')}\nDeadline ${E(q.deadline||'—')}\n${(q.config_list||[]).map(c=>`${E(c.config)} · ${E(c.area)} sqft · ${E(c.price)}`).join('\n')}\n${E(q.key_points||'')}</div>
 <label>Executive</label>${as?`<select id="ae">${opt('executive',x.executive_id)}</select>`:`<div>${x.executive_id?E(nm(x.executive_id)):'Unassigned'}</div>`}
 <label>Designer</label>${as?`<select id="ad">${opt('designer',x.designer_id)}</select><div class="row"><button class="btn" onclick="assign('${id}')">Save assignment</button></div>`:`<div>${x.designer_id?E(nm(x.designer_id)):'Unassigned'}</div>`}
 ${ed('brief','Brief (objective, audience, offer, format)',exe&&x.status==='brief')}${ed('content','Campaign content (texts, headlines, CTA, link)',exe&&x.status==='content')}${ed('setup','Setup confirmation (platform, campaign link)',exe&&x.status==='approved')}
 <label>Creative files</label>${[...x.campaign_assets].sort((a,b)=>a.version-b.version).map(a=>`<div class="log"><a href="#" onclick="view('${a.path}');return false">v${a.version} ${E(a.filename)}</a> ${E(a.note||'')}</div>`).join('')||'<div class="m">None yet</div>'}
 ${x.designer_id===me.id&&x.status==='designing'?`<input type="file" id="file" accept="image/*,video/mp4,application/pdf" style="margin-top:8px"><input id="note" placeholder="What changed?" style="margin-top:6px"><div class="row"><button class="btn" onclick="upload('${id}')">Upload new version</button></div>`:''}
 ${can&&NX[x.status]?`<label>Comment ${NX[x.status].some(n=>n[2])?'(required when sending back)':''}</label><textarea id="cm"></textarea><div class="row">${['brief','content','approved'].includes(x.status)&&exe?`<button class="btn" onclick="act('${id}','${x.status}')">Save draft</button>`:''}${NX[x.status].map(n=>`<button class="btn ${n[2]?'bad':'pri'}" onclick="act('${id}','${n[0]}')">${n[1]}</button>`).join('')}</div>`:''}
 ${mgr()&&!['verified','cancelled'].includes(x.status)?`<div class="row"><button class="btn" onclick="setState('item','${id}','${x.status==='on_hold'?'resume':'hold'}')">${x.status==='on_hold'?'Resume':'Put on hold'}</button><button class="btn bad" onclick="setState('item','${id}','cancel')">Cancel campaign</button></div>`:''}${x.state_reason?`<p class="m">Reason: ${E(x.state_reason)}</p>`:''}<div id="lg"></div>`;$('dr').classList.add('on');
 sb.from('campaign_activity').select('*').eq('item_id',id).order('at').then(({data})=>$('lg').innerHTML='<label>History</label>'+(data||[]).map(a=>`<div class="log">${new Date(a.at).toLocaleString('en-IN')} · ${E(nm(a.actor))} · ${a.from_status?LB[a.from_status]+' → '+LB[a.to_status]:''} ${E(a.comment||'')}</div>`).join(''))}
async function act(id,to){const d={};['brief','content','setup'].forEach(k=>{const e=$('f_'+k);if(e)d[k]=e.value});
 if(await run(sb.rpc('campaign_advance',{p_item:id,p_to:to,p_comment:$('cm')?.value||null,p_data:d}),'Saved')){await load();open_(id)}}
async function assign(id){if(await run(sb.rpc('campaign_assign',{p_item:id,p_exec:$('ae').value||null,p_designer:$('ad').value||null}),'Assignment saved')){await load();open_(id)}}
async function setState(k,id,a){const r=a==='resume'?null:prompt(a==='cancel'?'Reason for cancelling (required). This cannot be undone:':'Reason for putting on hold (required):');
 if(a!=='resume'&&!(r||'').trim())return;if(await run(sb.rpc('campaign_set_state',{p_kind:k,p_id:id,p_action:a,p_reason:r}),'Updated')){await load();if(k==='item')open_(id)}}
async function upload(id){const f=$('file').files[0];if(!f)return toast('Choose a file first');if(f.size>20*1048576)return toast('Files can be 20 MB at most');
 const x=I.find(i=>i.id===id),v=x.campaign_assets.length+1,path=`${id}/v${v}/${f.name.replace(/[^\w.\-]/g,'_')}`;
 if(!await run(sb.storage.from(B).upload(path,f,{contentType:f.type})))return;
 if(await run(sb.from('campaign_assets').insert({item_id:id,version:v,path,filename:f.name,mime:f.type,size_bytes:f.size,note:$('note').value}),'Uploaded')){await load();open_(id)}}
async function view(p){const r=await sb.storage.from(B).createSignedUrl(p,300);if(r.data)window.open(r.data.signedUrl);else toast(r.error.message)}
async function closeReq(id){const r=R.find(x=>x.id===id);
 if(prompt(`This permanently deletes all campaign data and files for "${r.project_name}". A JSON backup downloads first.\nType the project name to confirm:`)!==r.project_name)return toast('Close cancelled');
 const ids=I.filter(x=>x.request_id===id).map(x=>x.id),a=(await sb.from('campaign_activity').select('*').in('item_id',ids)).data||[];
 const url=URL.createObjectURL(new Blob([JSON.stringify({request:r,items:I.filter(x=>x.request_id===id),activity:a},null,1)],{type:'application/json'}));
 Object.assign(document.createElement('a'),{href:url,download:r.ref+'.json'}).click();
 const paths=await run(sb.rpc('campaign_prepare_close',{p_req:id}));if(!paths)return;
 for(let i=0;i<paths.length;i+=50){if(!await run(sb.storage.from(B).remove(paths.slice(i,i+50))))return}
 if(await run(sb.rpc('campaign_purge',{p_req:id}),'Closed. All campaign data deleted'))await load()}
</script></body></html>
