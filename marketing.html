/* ---- automatic compression of files above the admin upload limit ---- */
let BUSY=false;
const prog=m=>{const t=$('toast');clearTimeout(t._t);t.textContent=m;t.style.display='block'};
const loadJs=u=>new Promise((res,rej)=>{if(document.querySelector('script[src="'+u+'"]'))return res();const e=document.createElement('script');e.src=u;e.onload=res;e.onerror=()=>rej(new Error('Could not load '+u));document.head.appendChild(e)});
const swapExt=(n,e)=>n.replace(/\.[^.]+$/,'')+'.'+e;
async function fitFile(f,max){const t=f.type||'';
 if(/^image\/(jpeg|png|webp)$/.test(t))return fitImage(f,max);
 if(t.startsWith('video/'))return fitVideo(f,max);
 if(t==='application/pdf')return fitPdf(f,max);
 return null}
async function fitImage(f,max){prog('Compressing image…');const bmp=await createImageBitmap(f),webp=f.type==='image/webp',type=webp?'image/webp':'image/jpeg';let q=.9,sc=1,blob=null;
 for(let i=0;i<30;i++){const c=document.createElement('canvas');c.width=Math.max(1,Math.round(bmp.width*sc));c.height=Math.max(1,Math.round(bmp.height*sc));const x=c.getContext('2d');if(!webp){x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height)}x.drawImage(bmp,0,0,c.width,c.height);
  blob=await new Promise(r=>c.toBlob(r,type,q));if(blob&&blob.size<=max&&blob.type===type)break;blob=null;if(q>.55)q-=.1;else sc*=.85;if(sc<.05)break}
 if(!blob)return null;return new File([blob],webp?f.name:swapExt(f.name,'jpg'),{type})}
async function recVideo(v,dest,f,dur,max,k){
 const totalBps=max*8*k/dur,abps=Math.min(96000,totalBps*.2),vbps=Math.max(80000,totalBps-abps);
 const maxW=vbps>2.5e6?1920:vbps>1.2e6?1280:vbps>6e5?960:vbps>3e5?640:426,sc=Math.min(1,maxW/v.videoWidth),cw=Math.max(2,Math.round(v.videoWidth*sc/2)*2),ch=Math.max(2,Math.round(v.videoHeight*sc/2)*2);
 const cv=document.createElement('canvas');cv.width=cw;cv.height=ch;const cx=cv.getContext('2d');
 const mime=['video/mp4;codecs=avc1.42E01E,mp4a.40.2','video/mp4','video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'].find(m=>MediaRecorder.isTypeSupported(m));if(!mime)return null;
 const rec=new MediaRecorder(new MediaStream([...cv.captureStream(30).getVideoTracks(),...dest.stream.getAudioTracks()]),{mimeType:mime,videoBitsPerSecond:vbps,audioBitsPerSecond:abps}),chunks=[];
 rec.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};const stopped=new Promise(r=>rec.onstop=r);
 v.currentTime=0;const ended=new Promise(r=>{v.onended=r});
 try{await v.play()}catch(e){v.muted=true;await v.play()}
 let last=-1;const draw=setInterval(()=>{cx.drawImage(v,0,0,cw,ch);const pc=Math.min(99,Math.round(v.currentTime/dur*100));if(pc!==last){last=pc;prog('Compressing video… '+pc+'% — keep this tab open')}},33);
 rec.start(1000);await ended;clearInterval(draw);rec.stop();await stopped;
 const type=mime.split(';')[0];return new File([new Blob(chunks,{type})],swapExt(f.name,type==='video/mp4'?'mp4':'webm'),{type})}
async function fitVideo(f,max){if(!window.MediaRecorder||!HTMLCanvasElement.prototype.captureStream)return null;
 const url=URL.createObjectURL(f),v=document.createElement('video');v.src=url;v.playsInline=true;v.preload='auto';let ac=null;
 try{await new Promise((res,rej)=>{v.onloadedmetadata=res;v.onerror=()=>rej(new Error('Cannot read this video'))});
  const dur=v.duration;if(!isFinite(dur)||dur<=0)return null;
  ac=new(window.AudioContext||window.webkitAudioContext)();await ac.resume();const dest=ac.createMediaStreamDestination();ac.createMediaElementSource(v).connect(dest);
  let k=.85;for(let a=0;a<2;a++){const out=await recVideo(v,dest,f,dur,max,k);if(!out)return null;if(out.size<=max)return out;k*=max/out.size*.9;prog('Still too large — compressing again…')}
  return null}
 finally{if(ac)ac.close();URL.revokeObjectURL(url)}}
async function fitPdf(f,max){prog('Preparing PDF compression…');
 await loadJs('https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js');await loadJs('https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js');
 pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
 const doc=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise;
 for(const[sc,q]of[[1.5,.7],[1.2,.55],[1,.45],[.8,.35],[.6,.3]]){let pdf=null;
  for(let n=1;n<=doc.numPages;n++){prog('Compressing PDF… page '+n+' of '+doc.numPages);const pg=await doc.getPage(n),vp=pg.getViewport({scale:sc}),c=document.createElement('canvas');c.width=Math.round(vp.width);c.height=Math.round(vp.height);
   const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);await pg.render({canvasContext:x,viewport:vp}).promise;
   const w=c.width,h=c.height,o=w>h?'l':'p',img=c.toDataURL('image/jpeg',q);if(!pdf)pdf=new jspdf.jsPDF({unit:'pt',format:[w,h],orientation:o,compress:true});else pdf.addPage([w,h],o);pdf.addImage(img,'JPEG',0,0,w,h,undefined,'FAST')}
  const blob=pdf.output('blob');if(blob.size<=max)return new File([blob],f.name,{type:'application/pdf'})}
 return null}
